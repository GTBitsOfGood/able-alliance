name: E2E (Playwright)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: "true"
      TZ: America/New_York
      # Required by email imports; test rides must not use a real email service.
      JUNO_API_KEY: e2e-placeholder
      JUNO_BASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: API layer (backend)
        run: npx playwright test --project=api
      - name: UI layer (frontend)
        if: always()
        run: npx playwright test --project=ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
