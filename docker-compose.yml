services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    env_file: .env
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: Dockerfile.dev
    volumes:
      - ./src:/app/src
      - ./emails:/app/emails
      - ./scripts:/app/scripts
      - ./public:/app/public
      - ./next.config.ts:/app/next.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - next_cache:/app/.next
    ports:
      - "3000:3000"
    networks:
      - able-alliance-net
    depends_on:
      mongo:
        condition: service_healthy
      cas:
        condition: service_started
    command:
      - /bin/bash
      - -c
      - npm run dev

  mongo:
    image: mongo:4.0
    ports:
      - "27017:27017"
    networks:
      - able-alliance-net
    volumes:
      - mongodb-data:/data/db
    logging:
      driver: "none"
    healthcheck:
      test:
        ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  cas:
    build:
      context: ./mock-cas-server
      dockerfile: Dockerfile
    env_file: .env
    environment:
      PORT: "8443"
    ports:
      - "8443:8443"
    networks:
      - able-alliance-net

  websocket:
    build:
      context: .
      dockerfile: websocket-server/Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "4000"
    networks:
      - able-alliance-net

networks:
  able-alliance-net:
    driver: bridge

volumes:
  mongodb-data:
  next_cache:
