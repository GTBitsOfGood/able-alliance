app:
  source:
    root: /
  type: nodejs:24
  size: S
  build:
    flavor: none
  relationships:
    mongodb: mongodb:mongodb
  hooks:
    build: |
      set -eu
      HUSKY=0 npm ci --include=dev
      npm --prefix websocket-server ci --include=dev
      npm run build
      npm --prefix websocket-server prune --omit=dev
  mounts:
    /.next/cache:
      source: local
      source_path: next-cache
  web:
    commands:
      start: npm run start:upsun
    locations:
      /:
        root: ""
        allow: false
        passthru: true
      /socket.io/:
        root: ""
        allow: false
        passthru: true
        request_buffering:
          enabled: false
  disk: 512
